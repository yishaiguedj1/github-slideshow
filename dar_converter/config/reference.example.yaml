# Example reference file (fictional names). Copy to data/reference.yaml and edit.
# officers: the security team; shift_priority decides Shift 1/2/3 (lowest first).
# senders:  WhatsApp display name -> officer.
# people:   checked / escorted persons as written in the DAR comments
#           (escort: false = employee who never needs an escort).
# Hebrew prefixes (ל ו ה ב מ ש) are stripped automatically: "לרון" -> "רון".

officers:
  - name: Dana Cohen
    aliases: [דנה]
    shift_priority: 1
    supervisor: true             # can be the day's supervisor (Shift 1)
  - name: Avi Levi
    aliases: [אבי]
    shift_priority: 2
  - name: Noa Bar
    aliases: [נועה]
    shift_priority: 3
  - name: Gil Amir
    aliases: [גיל]
    shift_priority: 4
  - name: Omer Paz               # shares the alias עומר with the visitor Omer Gold
    aliases: [עומר]
    shift_priority: 5
  - name: Eli Tal                # left the team: from this date "אלי" is not matched to him
    aliases: [אלי]
    shift_priority: 6
    left: 2026-03-01

senders:
  "דנה - עבודה": Dana Cohen
  "אבי לוי": Avi Levi
  "נועה - עבודה - חברה": Noa Bar
  "גיל אמיר": Gil Amir

people:
  - name: Ron Shani
    aliases: [רון]
  - name: Tal Peretz
    aliases: [טל]
  - name: Gil Dror                # employee - no escort; shares the alias גיל with officer Gil Amir
    aliases: [גיל]
    escort: false
  - name: Tom Ben                 # employee - no escort
    aliases: [תום]
    escort: false
  - name: Mira Katz
    aliases: [מירה, המנקה]
    default_location: Office
    default_minutes: 60           # usual visit: with no exit report, the escort ends an hour later
  - name: Omer Gold               # escorted visitor; in escort lines "עומר" is him
    aliases: [עומר]

locations:
  C1: [c1]
  C2: [c2, v2]
  Storage: [מחסן]
  Office: [משרד]
  BLDG7: [bldg7, bldg 7]       # location names may contain digits
